<!DOCTYPE html>
<html>
    <head>
        <title>Bezier Curves</title>
        <link rel="stylesheet" href="styles.css" />
        <script src="script.js" defer></script>
    </head>
    <body onload="update_canvas()">
        <h1>
            Bezier Curves Editor
        </h1>
        <p>Drag the points around to edit the bezier curve. </p>
        <p>Add or remove point with the buttons.</p>

        <button onclick="add_point()">Add Point</button>

        <button onclick="remove_point()">Remove Point</button>
        <span style="color: rgb(58, 159, 159);">Bezier Curve Resoltion:</span>
        <input type="range" min="100" max="5000" value="500" id="myRange">
        <span id="rangeValue">500</span>
        
        <canvas id="myCanvas" width=300 height=750></canvas>
    </body>
</html>
